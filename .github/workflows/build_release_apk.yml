name: Build Signed Android Release APK (Enterprise Copper Compass)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-signed-apk:
    name: Build & Sign Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: |
          npm ci || npm install

      - name: 🏗️ Build Web Application (dist)
        run: |
          npm run build

      - name: ⚡ Sync Capacitor Android
        run: |
          npx cap sync android

      - name: 🔑 Make Gradlew Executable
        run: |
          chmod +x android/gradlew

      - name: 🔨 Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 🔐 Sign Android Release APK (if keystore provided)
        id: sign_app
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKey: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: 📤 Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-V2Ray-Client-Enterprise-Release-APK
          path: android/app/build/outputs/apk/release/
          retention-days: 30
